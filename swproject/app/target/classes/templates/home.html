<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>가계부 - 홈</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="dashboard">

<aside class="sidebar">
    <div class="brand">지출 예측 가계부</div>
    <nav>
        <a class="active" th:href="@{/}">홈</a>
        <a th:href="@{/expenses}">내역</a>
        <a th:href="@{/expenses/chart}">지출 분석</a>
        <a th:href="@{/subscriptions}">정기구독</a>

    </nav>
</aside>

<main class="main">

    <div class="greeting">
        <h1>안녕하세요!</h1>
        <p th:text="${todayLabel} + ' · 오늘도 지출을 가볍게 기록해보세요'">이번 달 요약</p>
    </div>

    <!-- 이번 달 지출/수입 요약 카드 -->
    <div class="summary-card">
        <div class="label" th:text="${todayLabel} + ' 지출'">이번 달 지출</div>
        <div class="amount" th:text="${#numbers.formatInteger(summary.monthExpense, 0, 'COMMA')} + '원'">0원</div>
        <div class="sub">
            이번 달 수입 <span th:text="${#numbers.formatInteger(summary.monthIncome, 0, 'COMMA')}">0</span>원 ·
            남은 예산 <span th:text="${#numbers.formatInteger(summary.monthIncome - summary.monthExpense, 0, 'COMMA')}">0</span>원
        </div>
        <div class="progress-track">
            <div class="progress-fill" th:style="'width:' + ${summary.expenseRatio} + '%'"></div>
        </div>
    </div>

    <!-- 빠른 메뉴 -->
    <div class="quick-menu">
        <a th:href="@{/expenses/new}">내역 추가<span class="desc">수입·지출을 기록해보세요</span></a>
        <a th:href="@{/expenses/chart}">지출 분석<span class="desc">패턴을 한눈에 확인해보세요</span></a>
        <a th:href="@{/subscriptions}">정기구독<span class="desc">고정 지출을 관리해보세요</span></a>
        <a th:href="@{/expenses}">가계부 보기<span class="desc">전체 내역을 확인해보세요</span></a>
    </div>

    <div class="dash-grid">

        <!-- 최근 내역 -->
        <div class="panel">
            <h3>최근 내역</h3>
            <div th:each="e : ${summary.recent}" class="recent-row">
                <div>
                    <div th:text="${e.category}">카테고리</div>
                    <div class="cat" th:text="${e.expenseDate}">날짜</div>
                </div>
                <div th:if="${e.type.name() == 'EXPENSE'}" style="color:#B8791A;"
                     th:text="'-' + ${#numbers.formatInteger(e.amount, 0, 'COMMA')} + '원'">-0원</div>
                <div th:if="${e.type.name() == 'INCOME'}" style="color:#2F5233;"
                     th:text="'+' + ${#numbers.formatInteger(e.amount, 0, 'COMMA')} + '원'">+0원</div>
            </div>
            <p th:if="${#lists.isEmpty(summary.recent)}" style="color:#6B6456; font-size:13px;">아직 기록이 없어요.</p>
        </div>

        <!-- 카테고리별 지출 현황 -->
        <div class="panel">
            <h3>이번 달 지출 현황</h3>
            <canvas id="categoryChart" width="240" height="240"></canvas>
            <div th:each="c : ${summary.categoryStats}" style="display:flex; justify-content:space-between; font-size:12.5px; margin-top:6px; color:#6B6456;">
                <span th:text="${c.category()}">카테고리</span>
                <span th:text="${c.percent()} + '%'">0%</span>
            </div>
        </div>

    </div>
</main>

<script th:src="@{/chart.umd.js}"></script>
<script th:inline="javascript">
    const categoryStats = /*[[${summary.categoryStats}]]*/ [];
    const labels = categoryStats.map(c => c.category);
    const data = categoryStats.map(c => c.amount);


    const ctx = document.getElementById('categoryChart');
    if (ctx && data.length > 0) {
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#6B9080', '#F0805E', '#FFD08A', '#9CB89F', '#DCC38A', '#C7C1AE'],
            borderWidth: 0
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          cutout: '65%'
        }
      });
    }
</script>

</body>
</html>
