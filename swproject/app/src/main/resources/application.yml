server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/swproject?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    debug: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  ai:
    api-key: ${API}