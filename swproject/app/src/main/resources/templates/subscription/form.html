<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>정기구독 · 고정지출 등록</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .hint { font-size: 11.5px; color: #9C9584; margin-top: 4px; }
        /* 체크박스는 style.css의 input 너비 규칙(100%)을 받지 않게 */
        form label.check { display: flex; align-items: center; gap: 6px; color: #3A3A32; font-size: 14px; }
        form label.check input { width: auto; max-width: none; margin: 0; }
    </style>
</head>
<body>

<h1 th:text="${subscription.id} != null ? '항목 수정' : '고정지출 추가'">고정지출 추가</h1>

<form th:action="${subscription.id} != null ? @{/subscriptions/{id}(id=${subscription.id})} : @{/subscriptions}"
      th:object="${subscription}" method="post">

    <!-- 수정 중 입력 검사에 걸려 폼이 다시 나타나도 "수정 중인 항목"이라는 걸 잃지 않도록 id를 함께 보냄 -->
    <input type="hidden" th:if="${subscription.id != null}" th:field="*{id}">

    <label for="name">항목 이름</label>
    <input type="text" id="name" th:field="*{name}" placeholder="예: 넷플릭스, 통신비, 월세">
    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

    <label for="amount">월 결제액</label>
    <input type="number" id="amount" th:field="*{amount}" placeholder="예: 17000">
    <div class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>

    <label for="billingDay">결제일 (매월)</label>
    <input type="number" id="billingDay" th:field="*{billingDay}" min="1" max="31" placeholder="1~31">
    <div class="hint">31일처럼 날짜가 없는 달에는 그 달 마지막 날로 계산돼요.</div>
    <div class="error" th:if="${#fields.hasErrors('billingDay')}" th:errors="*{billingDay}"></div>

    <label for="category">카테고리</label>
    <select id="category" th:field="*{category}">
        <option value="">선택하세요</option>
        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
    </select>
    <div class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>

    <label for="memo">메모 (선택)</label>
    <input type="text" id="memo" th:field="*{memo}" placeholder="예: 가족 요금제">

    <label class="check"><input type="checkbox" th:field="*{active}"> 사용 중</label>

    <button type="submit" class="btn" style="margin-top:20px;">저장</button>
    <a th:href="@{/subscriptions}" style="margin-left:10px; font-size:13px; color:#6B6456;">취소</a>
</form>

</body>
</html>
