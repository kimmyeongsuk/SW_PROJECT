<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>명세서로 가져오기</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<h1>명세서로 내역 가져오기</h1>
<a class="btn" th:href="@{/}">← 홈으로</a>

<div style="max-width:480px; background:#FFF; border:1px solid #EDE7D8; border-radius:14px; padding:24px; margin-top:16px;">
    <p style="font-size:13.5px; color:#6B6456; margin-bottom:16px;">
        은행 앱/웹에서 내려받은 거래내역 CSV 파일을 올려주세요.
        날짜·출금액·입금액·적요(내용) 컬럼을 자동으로 인식해서 등록합니다.
        카테고리는 일단 "미분류"로 등록되니, 등록 후 목록에서 직접 수정해주세요.
    </p>

    <form th:action="@{/expenses/upload}" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".csv" required style="margin-bottom:16px;">
        <br>
        <button type="submit" class="btn">업로드 및 등록</button>
    </form>

    <p th:if="${result}" th:text="${result}" style="color:#6B9080; font-weight:600; margin-top:12px;"></p>
    <p th:if="${error}" th:text="${error}" class="error" style="margin-top:12px;"></p>
</div>

<a th:href="@{/expenses}" style="display:inline-block; margin-top:16px; font-size:13px; color:#6B6456;">등록된 내역 확인하러 가기 →</a>

</body>
</html>
